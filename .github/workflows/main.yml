name: Deploy to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::872927006383:role/github-s3-deploy
          aws-region: ap-south-1

      - run: aws s3 sync . s3://deploytesting56 --delete --exclude ".git/*" --exclude ".github/*"
